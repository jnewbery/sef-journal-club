<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ SITEURL }}/favicon.png">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
</head>
<body>
  <header>
    <nav>
      <a class="site-title" href="{{ SITEURL }}/">
        <img src="{{ SITEURL }}/images/journal_club.png" alt="{{ SITENAME }} logo" class="site-logo">
        {{ SITENAME }}
      </a>
      <ul>
        {% for p in pages %}
        <li><a href="{{ SITEURL }}/{{ p.url }}">{{ p.title }}</a></li>
        {% endfor %}
        <li><a href="{{ MSTEAMS_URL }}" target="_blank" rel="noopener noreferrer">Teams &#x1F517;</a></li>
      </ul>
    </nav>
    <hr>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <hr>
    <div class="footer-line">
      <span>{{ SITENAME }}</span>
      <span class="footer-sep">|</span>
      <span class="footer-links">
        <a href="{{ MSTEAMS_URL }}">&#xF02BB;</a>
        <a href="{{ WHATSAPP_URL }}">&#xF232;</a>
      </span>
    </div>
  </footer>
  <script>
    document.querySelectorAll('a[href^="http"]').forEach(a => {
      if (a.hostname !== location.hostname) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
    });
  </script>
</body>
</html>
